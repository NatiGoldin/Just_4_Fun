<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<title>דרקון בשמיים</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; }
  canvas { display: block; border: 3px solid #1a6b8a; }
</style>
</head>
<body>
<canvas id="gameCanvas" width="900" height="500"></canvas>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ענן
class Cloud {
  constructor(x, y, scale) {
    this.x = x;
    this.y = y;
    this.scale = scale || 1;
    this.speed = (2.0 + Math.random() * 1.5) * this.scale * 0.65 + 1.4;
  }
  update() {
    this.x -= this.speed;
    if (this.x < -200) {
      this.x = canvas.width + 100 + Math.random() * 300;
      this.y = 30 + Math.random() * 200;
    }
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = '#ffffff';
    const s = this.scale;
    const x = this.x, y = this.y;
    ctx.beginPath();
    ctx.arc(x, y, 30 * s, 0, Math.PI * 2);
    ctx.arc(x + 30 * s, y - 10 * s, 38 * s, 0, Math.PI * 2);
    ctx.arc(x + 65 * s, y, 28 * s, 0, Math.PI * 2);
    ctx.arc(x + 85 * s, y + 10 * s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x - 15 * s, y + 10 * s, 22 * s, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// מצב מקשים
const keys = { up: false, down: false, left: false, right: false };

// דרקון
class Dragon {
  constructor() {
    this.x = 150;
    this.y = canvas.height / 2;
    this.vy = 0;
    this.vx = 0;
    this.speed = 4;
    this.wingAngle = 0;
    this.flapAnim = 0;
  }

  update() {
    if (keys.up)        this.vy = -this.speed;
    else if (keys.down) this.vy =  this.speed;
    else                this.vy = 0;

    if (keys.right)      this.vx =  this.speed;
    else if (keys.left)  this.vx = -this.speed;
    else                 this.vx = 0;

    this.y += this.vy;
    this.x += this.vx;

    // גבולות
    if (this.y < 30)                   { this.y = 30; this.vy = 0; }
    if (this.y > canvas.height - 60)   { this.y = canvas.height - 60; this.vy = 0; }
    if (this.x < 60)                   { this.x = 60; }
    if (this.x > canvas.width - 60)    { this.x = canvas.width - 60; }

    // אנימציית כנפיים
    const moving = keys.up || keys.down || keys.left || keys.right;
    this.flapAnim += moving ? 0.3 : 0.12;
    this.wingAngle = Math.sin(this.flapAnim) * 0.6;
  }

  draw() {
    const x = this.x;
    const y = this.y;
    ctx.save();
    ctx.translate(x, y);

    // זנב
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.moveTo(-35, 5);
    ctx.quadraticCurveTo(-65, 20, -80, 0);
    ctx.quadraticCurveTo(-65, -10, -35, 5);
    ctx.fill();

    // זנב קצה
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.moveTo(-75, 0);
    ctx.lineTo(-95, -10);
    ctx.lineTo(-85, 5);
    ctx.closePath();
    ctx.fill();

    // כנף תחתונה (אחורי)
    ctx.save();
    ctx.rotate(this.wingAngle * 0.5);
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.quadraticCurveTo(-20, 40, 10, 50);
    ctx.quadraticCurveTo(30, 30, 15, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // גוף
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.ellipse(0, 0, 40, 22, 0, 0, Math.PI * 2);
    ctx.fill();

    // בטן
    ctx.fillStyle = '#a8e6cf';
    ctx.beginPath();
    ctx.ellipse(5, 5, 25, 14, 0.2, 0, Math.PI * 2);
    ctx.fill();

    // כנף עליונה
    ctx.save();
    ctx.rotate(-this.wingAngle);
    ctx.fillStyle = '#1abc9c';
    ctx.strokeStyle = '#16a085';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-5, -10);
    ctx.lineTo(-15, -55);
    ctx.lineTo(10, -45);
    ctx.lineTo(30, -60);
    ctx.lineTo(35, -40);
    ctx.lineTo(20, -30);
    ctx.lineTo(15, -10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    // ורידי כנף
    ctx.strokeStyle = '#16a085';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-5, -10);
    ctx.lineTo(10, -45);
    ctx.moveTo(-5, -10);
    ctx.lineTo(30, -60);
    ctx.moveTo(-5, -10);
    ctx.lineTo(35, -40);
    ctx.stroke();
    ctx.restore();

    // ראש
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.ellipse(42, -8, 20, 16, -0.2, 0, Math.PI * 2);
    ctx.fill();

    // פה / אף
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.moveTo(55, -5);
    ctx.lineTo(72, -10);
    ctx.lineTo(72, -3);
    ctx.lineTo(55, 3);
    ctx.closePath();
    ctx.fill();

    // עיניים
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(50, -14, 6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath();
    ctx.arc(52, -14, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.arc(53, -14, 1.8, 0, Math.PI * 2);
    ctx.fill();

    // קרן
    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.moveTo(45, -22);
    ctx.lineTo(55, -38);
    ctx.lineTo(50, -20);
    ctx.closePath();
    ctx.fill();

    // אש מהפה
    if (this.vy < -2) {
      const flameX = 73;
      const flameY = -6;
      const t = Date.now() * 0.02;
      ctx.globalAlpha = 0.9;
      // אש גדולה
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.moveTo(flameX, flameY);
      ctx.quadraticCurveTo(flameX + 20 + Math.sin(t) * 5, flameY - 6, flameX + 35, flameY);
      ctx.quadraticCurveTo(flameX + 20 + Math.cos(t) * 5, flameY + 6, flameX, flameY);
      ctx.fill();
      // אש פנימית
      ctx.fillStyle = '#f39c12';
      ctx.beginPath();
      ctx.moveTo(flameX, flameY);
      ctx.quadraticCurveTo(flameX + 12 + Math.sin(t + 1) * 4, flameY - 3, flameX + 22, flameY);
      ctx.quadraticCurveTo(flameX + 12 + Math.cos(t + 1) * 4, flameY + 3, flameX, flameY);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    // רגליים קטנות
    ctx.fillStyle = '#27ae60';
    ctx.beginPath();
    ctx.moveTo(10, 18);
    ctx.lineTo(5, 32);
    ctx.lineTo(15, 32);
    ctx.lineTo(20, 20);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(25, 18);
    ctx.lineTo(20, 32);
    ctx.lineTo(30, 32);
    ctx.lineTo(35, 20);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }
}

// =========== מפלצת ===========
class Monster {
  constructor() {
    this.reset(true);
    this.anim = Math.random() * Math.PI * 2;
  }
  reset(init) {
    this.x = canvas.width + 80 + (init ? Math.random() * 600 : Math.random() * 300);
    this.y = 60 + Math.random() * (canvas.height - 140);
    this.speed = 3.0 + Math.random() * 1.8;
    this.r = 24;
    this.alive = true;
    this.deathTimer = 0;
    this.shootCooldown = Math.floor(120 + Math.random() * 180); // ירי ראשון רנדומלי
  }
  update() {
    this.x -= this.speed;
    this.anim += 0.08;
    if (this.x < -80) this.reset(false);
    // ירי תולעים בשלב 3 בלבד
    if (level === 3 && this.alive && this.x < canvas.width - 50) {
      this.shootCooldown--;
      if (this.shootCooldown <= 0) {
        // יורה 2-3 תולעים בו-זמנית
        const burst = Math.random() < 0.4 ? 3 : 2;
        for (let b = 0; b < burst; b++) {
          gums.push(new Gum(this.x - 10, this.y + (b - 1) * 18));
        }
        this.shootCooldown = 55 + Math.floor(Math.random() * 60);
      }
    }
  }
  draw() {
    const x = this.x, y = this.y + Math.sin(this.anim) * 5;
    ctx.save();
    ctx.translate(x, y);

    // גוף עגול סגול
    ctx.fillStyle = '#8e44ad';
    ctx.beginPath();
    ctx.ellipse(0, 0, 26, 20, 0, 0, Math.PI * 2);
    ctx.fill();

    // כנפיים עטלף
    ctx.fillStyle = '#6c3483';
    const wa = Math.sin(this.anim * 2) * 0.4;
    // כנף שמאל
    ctx.save(); ctx.rotate(-0.3 - wa);
    ctx.beginPath();
    ctx.moveTo(-10, -5);
    ctx.lineTo(-40, -30);
    ctx.lineTo(-20, -5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
    // כנף ימין
    ctx.save(); ctx.rotate(0.3 + wa);
    ctx.beginPath();
    ctx.moveTo(10, -5);
    ctx.lineTo(40, -30);
    ctx.lineTo(20, -5);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // עיניים זוהרות
    ctx.fillStyle = '#f1c40f';
    ctx.beginPath(); ctx.arc(-9, -4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -4, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(-9, -4, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -4, 3, 0, Math.PI * 2); ctx.fill();

    // פה עם שיניים
    ctx.fillStyle = '#c0392b';
    ctx.beginPath();
    ctx.arc(0, 8, 10, 0, Math.PI);
    ctx.fill();
    ctx.fillStyle = '#fff';
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 7, 8);
      ctx.lineTo(i * 7 - 3, 17);
      ctx.lineTo(i * 7 + 3, 17);
      ctx.closePath();
      ctx.fill();
    }

    ctx.restore();
  }
}

// =========== כדור אש ===========
class Fireball {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = 11;
    this.r = 10;
    this.alive = true;
    this.t = 0;
  }
  update() {
    this.x += this.vx;
    this.t += 0.3;
    if (this.x > canvas.width + 30) this.alive = false;
  }
  draw() {
    ctx.save();
    ctx.translate(this.x, this.y);
    // זנב אש
    for (let i = 3; i >= 0; i--) {
      ctx.globalAlpha = 0.2 + i * 0.15;
      ctx.fillStyle = i % 2 === 0 ? '#e74c3c' : '#f39c12';
      ctx.beginPath();
      ctx.ellipse(-i * 8, Math.sin(this.t + i) * 3, 10 + i * 3, 6, 0, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // גרעין
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f39c12';
    ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#e74c3c';
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// =========== תולעת ===========
class Gum {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = -(6 + Math.random() * 3);
    this.vy = (Math.random() - 0.5) * 2.5;
    this.r = 12;
    this.alive = true;
    this.t = 0;
    this.phase = Math.random() * Math.PI * 2;
    this.segments = 6;
    this.segLen = 11;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.t += 0.18;
    if (this.x < -120) this.alive = false;
  }
  draw() {
    ctx.save();

    // גוף מפולח - מתפתל
    for (let i = this.segments; i >= 0; i--) {
      const sx = this.x + i * this.segLen;
      const sy = this.y + Math.sin(this.t - i * 0.5 + this.phase) * 9;
      const isHead = i === 0;
      const r = isHead ? this.r : this.r - 1 - i * 0.6;

      // גוף
      ctx.fillStyle = isHead ? '#2d6a00' : (i % 2 === 0 ? '#3d8b00' : '#4cad00');
      ctx.beginPath();
      ctx.arc(sx, sy, Math.max(r, 3), 0, Math.PI * 2);
      ctx.fill();

      // קווי פירוק בין פרקים
      if (!isHead && i < this.segments) {
        ctx.strokeStyle = '#1a4000';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(sx, sy, Math.max(r, 3), 0, Math.PI * 2);
        ctx.stroke();
      }

      // ראש
      if (isHead) {
        // עיניים
        ctx.fillStyle = '#ff0000';
        ctx.beginPath(); ctx.arc(sx - 4, sy - 5, 4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 4, sy - 5, 4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.arc(sx - 3, sy - 5, 2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 5, sy - 5, 2, 0, Math.PI * 2); ctx.fill();

        // פה עם ניבים
        ctx.fillStyle = '#cc0000';
        ctx.beginPath();
        ctx.arc(sx, sy + 5, 6, 0, Math.PI);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.moveTo(sx - 4, sy + 5);
        ctx.lineTo(sx - 6, sy + 13);
        ctx.lineTo(sx - 1, sy + 5);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(sx + 4, sy + 5);
        ctx.lineTo(sx + 6, sy + 13);
        ctx.lineTo(sx + 1, sy + 5);
        ctx.closePath();
        ctx.fill();

        // מגבשושיות על הראש
        ctx.fillStyle = '#1a4000';
        ctx.beginPath(); ctx.arc(sx - 6, sy - 10, 3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(sx + 6, sy - 10, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    ctx.restore();
  }
}

// =========== טקסט צף ===========
class FloatingText {
  constructor(x, y, text) {
    this.x = x; this.y = y;
    this.text = text;
    this.t = 0; this.max = 55;
    this.alive = true;
  }
  update() {
    this.t++;
    this.y -= 0.9;
    if (this.t > this.max) this.alive = false;
  }
  draw() {
    const p = this.t / this.max;
    const alpha = p < 0.7 ? 1 : 1 - (p - 0.7) / 0.3;
    const scale = 1 + Math.sin(p * Math.PI) * 0.3;
    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.scale(scale, scale);
    ctx.globalAlpha = alpha;
    // בועת דיבור - רקע
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2.5;
    const tw = 110, th = 34;
    ctx.beginPath();
    ctx.roundRect(-tw/2, -th/2, tw, th, 10);
    ctx.fill();
    ctx.stroke();
    // זנב בועה
    ctx.beginPath();
    ctx.moveTo(-10, th/2);
    ctx.lineTo(0, th/2 + 12);
    ctx.lineTo(10, th/2);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.strokeStyle = '#8e44ad';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, th/2 - 1);
    ctx.lineTo(0, th/2 + 12);
    ctx.lineTo(10, th/2 - 1);
    ctx.stroke();
    // טקסט
    ctx.fillStyle = '#6c3483';
    ctx.font = 'bold 16px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(this.text, 0, 0);
    ctx.restore();
  }
}

// =========== פיצוץ ===========
class Explosion {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.t = 0; this.max = 25;
    this.alive = true;
    this.particles = Array.from({length: 10}, () => ({
      angle: Math.random() * Math.PI * 2,
      speed: 1.5 + Math.random() * 3,
      r: 3 + Math.random() * 5
    }));
  }
  update() { this.t++; if (this.t > this.max) this.alive = false; }
  draw() {
    const p = this.t / this.max;
    ctx.save();
    ctx.translate(this.x, this.y);
    for (const pt of this.particles) {
      const d = pt.speed * this.t;
      ctx.globalAlpha = 1 - p;
      ctx.fillStyle = this.t < 8 ? '#fff' : (this.t < 15 ? '#f39c12' : '#e74c3c');
      ctx.beginPath();
      ctx.arc(Math.cos(pt.angle) * d, Math.sin(pt.angle) * d, pt.r * (1 - p * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// =========== אתחול ===========
const clouds = [];
for (let i = 0; i < 7; i++) {
  clouds.push(new Cloud(Math.random() * canvas.width, 30 + Math.random() * 220, 0.5 + Math.random() * 0.9));
}

const dragon = new Dragon();
const monsters = [];
const fireballs = [];
const explosions = [];
const floatingTexts = [];
const gums = [];
let score = 0;
let lives = 3;
let gameStarted = false;
let gameOver = false;
let fireCooldown = 0;
let invincible = 0;
let level = 1;
let gameStartTime = 0;
let levelUpTime = 20;        // שלב 1 נמשך 20 שניות
let level2Duration = 20;     // שלב 2 נמשך 20 שניות
let level3Duration = 30;     // שלב 3 נמשך 30 שניות
let levelTransition = 0;
let levelTransitionTarget = 1; // לאיזה שלב עוברים
let gameWon = false;
let everGotHit = false; // האם הדרקון נפגע בכלל

// יצירת מפלצות (5 בסיסיות, עוד נוספות בשלב 3)
for (let i = 0; i < 5; i++) monsters.push(new Monster());

// =========== שליטה ===========
document.addEventListener('keydown', (e) => {
  if (!gameStarted || gameOver) return;
  if (e.code === 'ArrowUp')    { e.preventDefault(); keys.up = true; }
  if (e.code === 'ArrowDown')  { e.preventDefault(); keys.down = true; }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); keys.left = true; }
  if (e.code === 'ArrowRight') { e.preventDefault(); keys.right = true; }
  if (e.code === 'Space') {
    e.preventDefault();
    if (fireCooldown <= 0) {
      fireballs.push(new Fireball(dragon.x + 75, dragon.y - 6));
      fireCooldown = 18;
    }
  }
});
document.addEventListener('keyup', (e) => {
  if (e.code === 'ArrowUp')    keys.up = false;
  if (e.code === 'ArrowDown')  keys.down = false;
  if (e.code === 'ArrowLeft')  keys.left = false;
  if (e.code === 'ArrowRight') keys.right = false;
});

// =========== כפתורי מגע ===========
const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

const vBtns = {
  up:    { x: 100, y: 398, r: 30 },
  down:  { x: 100, y: 468, r: 30 },
  left:  { x: 58,  y: 433, r: 30 },
  right: { x: 142, y: 433, r: 30 },
  fire:  { x: 818, y: 433, r: 42 },
};

function drawVirtualButtons() {
  ctx.save();
  const dirs = [
    { key: 'up',    label: '▲' },
    { key: 'down',  label: '▼' },
    { key: 'left',  label: '◀' },
    { key: 'right', label: '▶' },
  ];
  for (const d of dirs) {
    const btn = vBtns[d.key];
    const pressed = keys[d.key];
    ctx.globalAlpha = pressed ? 0.85 : 0.38;
    ctx.fillStyle = pressed ? '#ffffff' : '#aaaacc';
    ctx.beginPath(); ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = pressed ? 1 : 0.75;
    ctx.fillStyle = pressed ? '#1a5c7a' : '#333';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(d.label, btn.x, btn.y + 1);
  }
  // כפתור אש
  const fb = vBtns.fire;
  const fp = !!keys._fire;
  ctx.globalAlpha = fp ? 0.95 : 0.45;
  const gr = ctx.createRadialGradient(fb.x - 8, fb.y - 8, 4, fb.x, fb.y, fb.r);
  gr.addColorStop(0, '#f9ca24');
  gr.addColorStop(0.5, '#f0932b');
  gr.addColorStop(1, '#e74c3c');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.arc(fb.x, fb.y, fb.r, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = fp ? 1 : 0.7;
  ctx.font = '28px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🔥', fb.x, fb.y);
  ctx.globalAlpha = 1;
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function getActiveTouchBtns(touches) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width / rect.width;
  const sy = canvas.height / rect.height;
  const active = new Set();
  for (const t of touches) {
    const tx = (t.clientX - rect.left) * sx;
    const ty = (t.clientY - rect.top) * sy;
    for (const [name, btn] of Object.entries(vBtns)) {
      const dx = tx - btn.x, dy = ty - btn.y;
      if (dx * dx + dy * dy < btn.r * btn.r) active.add(name);
    }
  }
  return active;
}

function applyTouchBtns(active) {
  keys.up    = active.has('up');
  keys.down  = active.has('down');
  keys.left  = active.has('left');
  keys.right = active.has('right');
  keys._fire = active.has('fire');
}

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const t = e.changedTouches[0];
  const mx = (t.clientX - rect.left) * (canvas.width / rect.width);
  const my = (t.clientY - rect.top) * (canvas.height / rect.height);
  if (!gameStarted) {
    const b = canvas._btnRect;
    if (b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) startGame();
    return;
  }
  if (gameOver || gameWon) {
    const b = canvas._restartRect;
    if (b && mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) restartGame();
    return;
  }
  applyTouchBtns(getActiveTouchBtns(e.touches));
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!gameStarted || gameOver || gameWon) return;
  applyTouchBtns(getActiveTouchBtns(e.touches));
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  e.preventDefault();
  if (!gameStarted || gameOver || gameWon) return;
  applyTouchBtns(getActiveTouchBtns(e.touches));
}, { passive: false });

canvas.addEventListener('touchcancel', (e) => {
  keys.up = keys.down = keys.left = keys.right = keys._fire = false;
}, { passive: false });

// =========== שמיים ===========
function drawSky() {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#87ceeb');
  grad.addColorStop(0.6, '#b0e0ff');
  grad.addColorStop(1, '#d4f1ff');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// =========== HUD ===========
function drawUI() {
  // ניקוד
  ctx.fillStyle = 'rgba(0,40,80,0.55)';
  ctx.beginPath(); ctx.roundRect(10, 10, 140, 40, 10); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'left';
  ctx.fillText('ניקוד: ' + score, 20, 36);

  // שלב
  const lvlColor = level === 3 ? '#e74c3c' : level === 2 ? '#f39c12' : '#7ed6df';
  ctx.fillStyle = 'rgba(0,40,80,0.55)';
  ctx.beginPath(); ctx.roundRect(canvas.width/2 - 55, 10, 110, 40, 10); ctx.fill();
  ctx.fillStyle = lvlColor;
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('שלב ' + level, canvas.width/2, 36);

  // טיימר
  const elapsed = (Date.now() - gameStartTime) / 1000;
  const limit = level === 1 ? levelUpTime : level === 2 ? level2Duration : level3Duration;
  const remaining = Math.max(0, Math.ceil(limit - elapsed));
  ctx.fillStyle = remaining <= 5 ? '#e74c3c' : 'rgba(0,40,80,0.55)';
  ctx.beginPath(); ctx.roundRect(canvas.width - 155, 10, 145, 40, 10); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 20px Arial';
  ctx.textAlign = 'right';
  ctx.fillText('⏱ ' + remaining + ' שנ\'', canvas.width - 15, 36);

  // חיים
  ctx.textAlign = 'right';
  for (let i = 0; i < lives; i++) {
    ctx.font = '24px Arial';
    ctx.fillText('❤️', canvas.width - 10 - i * 30, 72);
  }

  // הוראות
  ctx.fillStyle = 'rgba(0,60,100,0.45)';
  ctx.font = 'bold 15px Arial';
  ctx.textAlign = 'center';
  ctx.fillText('חצים = תנועה   |   רווח = אש', canvas.width / 2, canvas.height - 12);
}

// =========== אנימציית מעבר שלב ===========
function drawLevelTransition() {
  const p = levelTransition / 180;
  const alpha = p > 0.7 ? (p - 0.7) / 0.3 : (p < 0.2 ? p / 0.2 : 1);
  ctx.save();
  ctx.globalAlpha = Math.min(alpha * 0.92, 0.92);
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.globalAlpha = alpha;

  // כוכבים
  ctx.fillStyle = '#f1c40f';
  for (let i = 0; i < 12; i++) {
    const a = (i / 12) * Math.PI * 2 + (1 - p) * 3;
    const r = 120 + Math.sin(p * Math.PI * 2 + i) * 20;
    ctx.font = '22px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('⭐', canvas.width/2 + Math.cos(a)*r, canvas.height/2 + Math.sin(a)*r * 0.5);
  }

  const isLvl3 = levelTransitionTarget === 3;
  ctx.fillStyle = isLvl3 ? '#e74c3c' : '#f39c12';
  ctx.font = 'bold 70px Arial';
  ctx.textAlign = 'center';
  ctx.shadowColor = isLvl3 ? '#c0392b' : '#e67e22'; ctx.shadowBlur = 25;
  ctx.fillText('שלב ' + levelTransitionTarget + '!', canvas.width/2, canvas.height/2 - 20);
  ctx.font = 'bold 26px Arial';
  ctx.fillStyle = '#fff';
  ctx.shadowBlur = 0;
  ctx.fillText(isLvl3 ? 'המפלצות יורות תולעים מפחידות! 🐛' : 'מהירות גבוהה יותר!', canvas.width/2, canvas.height/2 + 40);
  ctx.restore();
}

// =========== טבלת דרגות ===========
function drawRankTable(yBase, currentPlace) {
  const cols = [
    { x: 225, medal: '🥇', label: 'מקום ראשון', pts: 'מעל 300 נק\'', place: 1, color: '#f1c40f' },
    { x: 450, medal: '🥈', label: 'מקום שני',    pts: 'עד 200 נק\'',  place: 2, color: '#bdc3c7' },
    { x: 675, medal: '🥉', label: 'מקום שלישי', pts: 'עד 100 נק\'',  place: 3, color: '#cd6133' },
  ];
  const colW = 185, colH = 80;

  for (const col of cols) {
    const isActive = col.place === currentPlace;
    const bx = col.x - colW / 2;

    // קופסת רקע
    ctx.fillStyle = isActive
      ? (col.place === 1 ? 'rgba(241,196,15,0.3)' : col.place === 2 ? 'rgba(189,195,199,0.3)' : 'rgba(205,97,51,0.3)')
      : 'rgba(255,255,255,0.07)';
    ctx.strokeStyle = isActive ? col.color : 'rgba(255,255,255,0.25)';
    ctx.lineWidth = isActive ? 2.5 : 1;
    ctx.beginPath();
    ctx.roundRect(bx, yBase, colW, colH, 14);
    ctx.fill();
    ctx.stroke();

    // מדליה
    ctx.globalAlpha = isActive ? 1 : 0.55;
    ctx.font = '26px Arial';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#fff';
    ctx.fillText(col.medal, col.x, yBase + 28);
    ctx.globalAlpha = 1;

    // שם דרגה
    ctx.font = isActive ? 'bold 15px Arial' : '14px Arial';
    ctx.fillStyle = isActive ? col.color : 'rgba(255,255,255,0.7)';
    if (isActive) { ctx.shadowColor = col.color; ctx.shadowBlur = 8; }
    ctx.fillText(col.label, col.x, yBase + 50);
    ctx.shadowBlur = 0;

    // סף נקודות
    ctx.font = '12px Arial';
    ctx.fillStyle = isActive ? '#fff' : 'rgba(255,255,255,0.4)';
    ctx.fillText(col.pts, col.x, yBase + 67);
  }
}

// =========== מסך ניצחון ===========
function drawWinScreen() {
  const rank = getRank();
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';

  ctx.font = 'bold 52px Arial';
  ctx.fillStyle = '#f1c40f';
  ctx.shadowColor = '#f39c12'; ctx.shadowBlur = 20;
  ctx.fillText('כל הכבוד! 🏆', canvas.width/2, canvas.height/2 - 110);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 24px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('סיימת את כל שלושת השלבים!', canvas.width/2, canvas.height/2 - 65);
  if (!everGotHit) {
    ctx.fillStyle = '#2ecc71';
    ctx.font = 'bold 20px Arial';
    ctx.fillText('✨ ניצחון נקי - לא נפגעת כלל! +50 בונוס', canvas.width/2, canvas.height/2 - 38);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 24px Arial';
    ctx.fillText('ניקוד סופי: ' + (score + 50), canvas.width/2, canvas.height/2 - 14);
  } else {
    ctx.fillText('ניקוד סופי: ' + score, canvas.width/2, canvas.height/2 - 30);
  }

  // דרגה
  ctx.font = 'bold 36px Arial';
  ctx.fillStyle = rank.color;
  ctx.shadowColor = rank.color; ctx.shadowBlur = 12;
  ctx.fillText(rank.label, canvas.width/2, canvas.height/2 + 15);
  ctx.shadowBlur = 0;

  // טבלת דרגות
  drawRankTable(canvas.height/2 + 35, rank.place);

  const bw = 220, bh = 50, bx = canvas.width/2 - 110, by = canvas.height/2 + 130;
  const bg = ctx.createLinearGradient(bx, by, bx, by+bh);
  bg.addColorStop(0, '#2ecc71'); bg.addColorStop(1, '#16a085');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 28); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('שחק שוב', canvas.width/2, by + 33);
  ctx.restore();
  canvas._restartRect = { x: bx, y: by, w: bw, h: bh };
}

// =========== בדיקת התנגשויות ===========
function checkCollisions() {
  // כדורי אש vs מפלצות
  for (const fb of fireballs) {
    if (!fb.alive) continue;
    for (const m of monsters) {
      if (!m.alive) continue;
      const dx = fb.x - m.x, dy = fb.y - m.y;
      if (Math.sqrt(dx*dx + dy*dy) < m.r + fb.r) {
        fb.alive = false;
        m.alive = false;
        floatingTexts.push(new FloatingText(m.x, m.y - 30, 'הלך עליי!'));
        setTimeout(() => { explosions.push(new Explosion(m.x, m.y)); }, 400);
        score += 10;
        setTimeout(() => m.reset(false), 500);
        setTimeout(() => { m.alive = true; }, 500);
      }
    }
  }

  // דרקון vs מסטיקים
  if (invincible <= 0) {
    for (const g of gums) {
      if (!g.alive) continue;
      const dx = dragon.x + 20 - g.x, dy = dragon.y - g.y;
      if (Math.sqrt(dx*dx + dy*dy) < g.r + 22) {
        g.alive = false;
        lives--;
        invincible = 90;
        everGotHit = true;
        explosions.push(new Explosion(dragon.x + 20, dragon.y));
        if (lives <= 0) gameOver = true;
      }
    }
  }

  // דרקון vs מפלצות
  if (invincible > 0) return;
  for (const m of monsters) {
    if (!m.alive) continue;
    const dx = dragon.x + 20 - m.x, dy = dragon.y - m.y;
    if (Math.sqrt(dx*dx + dy*dy) < m.r + 28) {
      lives--;
      invincible = 90;
      everGotHit = true;
      explosions.push(new Explosion(m.x, m.y));
      m.reset(false);
      if (lives <= 0) gameOver = true;
    }
  }
}

// =========== מסך פתיחה ===========
function drawStartScreen() {
  drawSky();
  for (const cloud of clouds) { cloud.update(); cloud.draw(); }

  dragon.flapAnim += 0.08;
  dragon.wingAngle = Math.sin(dragon.flapAnim) * 0.6;
  dragon.y = canvas.height / 2 - 30 + Math.sin(dragon.flapAnim * 0.5) * 18;
  dragon.draw();

  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = 'bold 52px Arial';
  ctx.fillStyle = '#ffffff';
  ctx.shadowColor = '#0077aa';
  ctx.shadowBlur = 18;
  ctx.fillText('דרקון השמיים', canvas.width / 2, 110);
  ctx.shadowBlur = 0;

  const bw = 220, bh = 60;
  const bx = canvas.width / 2 - bw / 2;
  const by = canvas.height / 2 + 80;

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.roundRect(bx+4, by+6, bw, bh, 30); ctx.fill();
  const bg = ctx.createLinearGradient(bx, by, bx, by+bh);
  bg.addColorStop(0, '#2ecc71'); bg.addColorStop(1, '#16a085');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 30); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 30); ctx.stroke();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px Arial';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
  ctx.fillText('התחל משחק', canvas.width / 2, by + 40);
  ctx.shadowBlur = 0;
  ctx.restore();

  canvas._btnRect = { x: bx, y: by, w: bw, h: bh };
}

// =========== מסך Game Over ===========
function drawGameOver() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';

  ctx.font = 'bold 72px Arial';
  ctx.fillStyle = '#e74c3c';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 20;
  ctx.fillText('!נפסלת', canvas.width/2, canvas.height/2 - 40);
  ctx.shadowBlur = 0;

  ctx.font = 'bold 32px Arial';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('נסה שוב', canvas.width/2, canvas.height/2 + 30);

  const bw = 220, bh = 50, bx = canvas.width/2 - 110, by = canvas.height/2 + 80;
  const bg = ctx.createLinearGradient(bx, by, bx, by+bh);
  bg.addColorStop(0, '#e74c3c'); bg.addColorStop(1, '#c0392b');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 28); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 22px Arial';
  ctx.fillText('שחק שוב', canvas.width/2, by + 33);
  ctx.restore();

  canvas._restartRect = { x: bx, y: by, w: bw, h: bh };
}

// =========== קליקים ===========
canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const my = (e.clientY - rect.top) * (canvas.height / rect.height);

  if (!gameStarted) {
    const b = canvas._btnRect;
    if (b && mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) startGame();
    return;
  }
  if (gameOver || gameWon) {
    const b = canvas._restartRect;
    if (b && mx >= b.x && mx <= b.x+b.w && my >= b.y && my <= b.y+b.h) restartGame();
  }
});

function startGame() {
  gameStarted = true;
  gameStartTime = Date.now();
  dragon.x = 150; dragon.y = canvas.height / 2; dragon.vy = 0;
  requestAnimationFrame(gameLoop);
}

function restartGame() {
  score = 0; lives = 3; gameOver = false; gameWon = false; everGotHit = false;
  invincible = 0; level = 1; levelTransition = 0;
  fireballs.length = 0; explosions.length = 0; floatingTexts.length = 0; gums.length = 0;
  dragon.x = 150; dragon.y = canvas.height / 2;
  gameStartTime = Date.now();
  monsters.length = 0;
  for (let i = 0; i < 5; i++) monsters.push(new Monster());
  for (const c of clouds) c.speed = (2.0 + Math.random() * 1.5) * c.scale * 0.65 + 1.4;
}

function enterLevel2() {
  level = 2;
  levelTransitionTarget = 2;
  levelTransition = 180;
  gameStartTime = Date.now();
  for (const m of monsters) { m.speed = (m.speed + 1.5) * 1.4; m.reset(false); }
  for (const c of clouds) c.speed *= 1.8;
}

function enterLevel3() {
  level = 3;
  levelTransitionTarget = 3;
  levelTransition = 180;
  gameStartTime = Date.now();
  gums.length = 0;
  // אותה מהירות כמו שלב 2 - לא מאיצים
  for (const m of monsters) m.reset(false);
  // הוספת 4 מפלצות נוספות שיורות יותר תולעים
  while (monsters.length < 12) monsters.push(new Monster());
}

function getRank() {
  if (score >= 300) return { place: 1, label: '🥇 מקום ראשון!',  color: '#f1c40f' };
  if (score >= 200) return { place: 2, label: '🥈 מקום שני!',    color: '#bdc3c7' };
  if (score >= 100) return { place: 3, label: '🥉 מקום שלישי!', color: '#cd6133' };
  return { place: 0, label: 'נסה שוב... 💪', color: '#e74c3c' };
}

// =========== לולאה ראשית ===========
function gameLoop() {
  drawSky();
  for (const cloud of clouds) { cloud.update(); cloud.draw(); }

  if (!gameOver && !gameWon) {
    // בדיקת טיימר שלב
    const elapsed = (Date.now() - gameStartTime) / 1000;
    if (level === 1 && elapsed >= levelUpTime) {
      enterLevel2();
    } else if (level === 2 && elapsed >= level2Duration) {
      enterLevel3();
    } else if (level === 3 && elapsed >= level3Duration) {
      gameWon = true;
    }

    if (levelTransition > 0) levelTransition--;

    dragon.update();
    if (fireCooldown > 0) fireCooldown--;
    if (keys._fire && fireCooldown <= 0) {
      fireballs.push(new Fireball(dragon.x + 75, dragon.y - 6));
      fireCooldown = 18;
    }
    if (invincible > 0) invincible--;

    for (const m of monsters) { m.update(); m.draw(); }

    for (const fb of fireballs) { fb.update(); fb.draw(); }
    fireballs.splice(0, fireballs.length, ...fireballs.filter(f => f.alive));

    for (const g of gums) { g.update(); g.draw(); }
    gums.splice(0, gums.length, ...gums.filter(g => g.alive));

    checkCollisions();
  }

  for (const ex of explosions) { ex.update(); ex.draw(); }
  explosions.splice(0, explosions.length, ...explosions.filter(e => e.alive));

  for (const ft of floatingTexts) { ft.update(); ft.draw(); }
  floatingTexts.splice(0, floatingTexts.length, ...floatingTexts.filter(f => f.alive));

  // הבהוב כשפגועים
  if (invincible <= 0 || Math.floor(invincible / 6) % 2 === 0) dragon.draw();

  drawUI();
  if (isTouchDevice && !gameOver && !gameWon) drawVirtualButtons();
  if (levelTransition > 0) drawLevelTransition();
  if (gameOver) drawGameOver();
  if (gameWon) drawWinScreen();

  requestAnimationFrame(gameLoop);
}

// =========== מסך פתיחה לולאה ===========
function startScreenLoop() {
  if (gameStarted) return;
  drawStartScreen();
  requestAnimationFrame(startScreenLoop);
}

startScreenLoop();
</script>
