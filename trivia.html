<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>משחק טריוויה</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0c29;
      overflow: hidden;
    }

    /* ---- STARS BACKGROUND ---- */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      background: #fff;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) infinite alternate;
    }

    @keyframes twinkle {
      from { opacity: 0.2; transform: scale(1); }
      to   { opacity: 1;   transform: scale(1.4); }
    }

    /* ---- SCREENS ---- */
    .screen {
      position: relative;
      z-index: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 100%;
      max-width: 680px;
      padding: 20px;
    }

    .screen.active { display: flex; }

    /* ---- START SCREEN ---- */
    #start-screen {
      gap: 32px;
    }

    .logo {
      font-size: 5rem;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-14px); }
    }

    h1 {
      font-size: 3rem;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: none;
      line-height: 1.2;
    }

    .subtitle {
      color: #ccc;
      font-size: 1.1rem;
    }

    .btn-start {
      padding: 18px 56px;
      font-size: 1.4rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 8px 30px rgba(255, 78, 80, 0.45);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-start:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 14px 36px rgba(255, 78, 80, 0.55);
    }

    /* ---- GAME SCREEN ---- */
    #game-screen {
      gap: 24px;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #eee;
      font-size: 1rem;
    }

    .score-badge {
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      color: #fff;
      font-weight: 700;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 1rem;
    }

    /* Progress bar */
    .progress-wrap {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.15);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #f9d423, #ff4e50);
      transition: width 0.5s ease;
    }

    .question-card {
      width: 100%;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 32px 28px;
    }

    .question-num {
      font-size: 0.85rem;
      color: #f9d423;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .question-text {
      font-size: 1.5rem;
      color: #fff;
      line-height: 1.5;
    }

    .answers-grid {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .btn-answer {
      padding: 18px 14px;
      font-size: 1.05rem;
      font-weight: 600;
      border: 2px solid rgba(255,255,255,0.18);
      border-radius: 14px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      transition: all 0.22s;
      line-height: 1.3;
    }

    .btn-answer:hover:not(:disabled) {
      background: rgba(249, 212, 35, 0.18);
      border-color: #f9d423;
      transform: translateY(-3px);
    }

    .btn-answer.correct {
      background: rgba(72, 199, 142, 0.35);
      border-color: #48c78e;
      animation: pulse-green 0.4s ease;
    }

    .btn-answer.wrong {
      background: rgba(255, 78, 80, 0.35);
      border-color: #ff4e50;
      animation: shake 0.4s ease;
    }

    @keyframes pulse-green {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-6px); }
      75%       { transform: translateX(6px); }
    }

    .feedback {
      font-size: 1.1rem;
      font-weight: 600;
      min-height: 28px;
      color: #fff;
    }

    /* ---- RESULTS SCREEN ---- */
    #result-screen {
      gap: 28px;
    }

    .trophy {
      font-size: 5rem;
      animation: float 2.5s ease-in-out infinite;
    }

    .result-title {
      font-size: 2.2rem;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .final-score {
      font-size: 1.2rem;
      color: #ddd;
    }

    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: conic-gradient(#f9d423 var(--pct), rgba(255,255,255,0.1) 0);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .score-circle::before {
      content: '';
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: #0f0c29;
    }

    .score-number {
      position: relative;
      font-size: 2rem;
      font-weight: 800;
      color: #f9d423;
    }

    .stars-rating {
      font-size: 2.4rem;
      letter-spacing: 6px;
    }

    .btn-restart {
      padding: 16px 48px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #f9d423, #ff4e50);
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 24px rgba(255,78,80,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-restart:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(255,78,80,0.5);
    }

    @media (max-width: 500px) {
      h1 { font-size: 2.2rem; }
      .answers-grid { grid-template-columns: 1fr; }
      .question-text { font-size: 1.25rem; }
    }
  </style>
</head>
<body>

<!-- Stars background -->
<div class="stars" id="stars"></div>

<!-- ===== START SCREEN ===== -->
<div class="screen active" id="start-screen">
  <div class="logo">🧠</div>
  <h1>משחק טריוויה</h1>
  <p class="subtitle">5 שאלות · 4 תשובות · 100 נקודות לשאלה</p>
  <button class="btn-start" onclick="startGame()">התחל משחק ▶</button>
</div>

<!-- ===== GAME SCREEN ===== -->
<div class="screen" id="game-screen">
  <div class="top-bar">
    <span id="q-counter">שאלה 1 מתוך 5</span>
    <span class="score-badge">⭐ <span id="score-display">0</span></span>
  </div>

  <div class="progress-wrap">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div class="question-card">
    <div class="question-num" id="q-num"></div>
    <div class="question-text" id="q-text"></div>
  </div>

  <div class="answers-grid" id="answers-grid"></div>

  <div class="feedback" id="feedback"></div>
</div>

<!-- ===== RESULT SCREEN ===== -->
<div class="screen" id="result-screen">
  <div class="trophy" id="trophy-emoji">🏆</div>
  <h2 class="result-title" id="result-title"></h2>
  <div class="score-circle" id="score-circle">
    <div class="score-number" id="final-score-num"></div>
  </div>
  <div class="final-score" id="final-score-text"></div>
  <div class="stars-rating" id="stars-rating"></div>
  <button class="btn-restart" onclick="restartGame()">שחק שוב 🔄</button>
</div>

<script>
  /* ---------- GENERATE STARS ---------- */
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.classList.add('star');
    const size = Math.random() * 3 + 1;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      top:${Math.random()*100}%;
      left:${Math.random()*100}%;
      --d:${(Math.random()*4+2).toFixed(1)}s;
      animation-delay:${(Math.random()*4).toFixed(1)}s;
    `;
    starsEl.appendChild(s);
  }

  /* ---------- QUESTIONS ---------- */
  const questions = [
    {
      text: "מהי בירת ישראל?",
      answers: ["תל אביב", "ירושלים", "חיפה", "באר שבע"],
      correct: 1
    },
    {
      text: "כמה יבשות יש על כדור הארץ?",
      answers: ["5", "6", "7", "8"],
      correct: 2
    },
    {
      text: "מי כתב את 'הארי פוטר'?",
      answers: ["ג'ורג' אורוול", "ג'.ק. רולינג", "רואלד דאל", "ג'ון טולקין"],
      correct: 1
    },
    {
      text: "מהו המספר הראשוני הראשון?",
      answers: ["1", "2", "3", "5"],
      correct: 1
    },
    {
      text: "באיזו שנה התרחשה מלחמת העולם השנייה?",
      answers: ["1914-1918", "1929-1935", "1939-1945", "1950-1953"],
      correct: 2
    }
  ];

  /* ---------- STATE ---------- */
  let currentQ = 0;
  let score = 0;
  const POINTS_PER_Q = 100;

  /* ---------- HELPERS ---------- */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  /* ---------- START ---------- */
  function startGame() {
    currentQ = 0;
    score = 0;
    show('game-screen');
    loadQuestion();
  }

  /* ---------- LOAD QUESTION ---------- */
  function loadQuestion() {
    const q = questions[currentQ];

    document.getElementById('q-counter').textContent = `שאלה ${currentQ + 1} מתוך ${questions.length}`;
    document.getElementById('score-display').textContent = score;
    document.getElementById('q-num').textContent = `שאלה ${currentQ + 1}`;
    document.getElementById('q-text').textContent = q.text;
    document.getElementById('feedback').textContent = '';

    // Progress
    const pct = (currentQ / questions.length) * 100;
    document.getElementById('progress-fill').style.width = pct + '%';

    // Answers
    const grid = document.getElementById('answers-grid');
    grid.innerHTML = '';
    q.answers.forEach((ans, i) => {
      const btn = document.createElement('button');
      btn.classList.add('btn-answer');
      btn.textContent = ans;
      btn.onclick = () => handleAnswer(i);
      grid.appendChild(btn);
    });
  }

  /* ---------- HANDLE ANSWER ---------- */
  function handleAnswer(chosen) {
    const q = questions[currentQ];
    const buttons = document.querySelectorAll('.btn-answer');

    // Disable all
    buttons.forEach(b => b.disabled = true);

    const feedback = document.getElementById('feedback');

    if (chosen === q.correct) {
      buttons[chosen].classList.add('correct');
      score += POINTS_PER_Q;
      document.getElementById('score-display').textContent = score;
      feedback.textContent = '✅ נכון! +100 נקודות';
      feedback.style.color = '#48c78e';
    } else {
      buttons[chosen].classList.add('wrong');
      buttons[q.correct].classList.add('correct');
      feedback.textContent = `❌ טעות! התשובה הנכונה: ${q.answers[q.correct]}`;
      feedback.style.color = '#ff4e50';
    }

    setTimeout(() => {
      currentQ++;
      if (currentQ < questions.length) {
        loadQuestion();
      } else {
        showResult();
      }
    }, 1600);
  }

  /* ---------- SHOW RESULT ---------- */
  function showResult() {
    show('result-screen');

    const total = questions.length * POINTS_PER_Q;
    const pct = Math.round((score / total) * 100);

    // Animate progress circle
    document.getElementById('score-circle').style.setProperty('--pct', pct + '%');
    document.getElementById('final-score-num').textContent = score;
    document.getElementById('final-score-text').textContent = `${score} מתוך ${total} נקודות`;

    // Title + trophy + stars based on score
    let title, trophy, stars;
    if (score === total) {
      title = 'מושלם! אתה גאון! 🎉';
      trophy = '🏆';
      stars = '⭐⭐⭐⭐⭐';
    } else if (score >= total * 0.8) {
      title = 'כל הכבוד! ביצוע מעולה!';
      trophy = '🥇';
      stars = '⭐⭐⭐⭐';
    } else if (score >= total * 0.6) {
      title = 'לא רע! יש מקום לשיפור';
      trophy = '🥈';
      stars = '⭐⭐⭐';
    } else if (score >= total * 0.4) {
      title = 'ניסיון טוב, נסה שוב!';
      trophy = '🥉';
      stars = '⭐⭐';
    } else {
      title = 'תרגל עוד קצת 💪';
      trophy = '📚';
      stars = '⭐';
    }

    document.getElementById('result-title').textContent = title;
    document.getElementById('trophy-emoji').textContent = trophy;
    document.getElementById('stars-rating').textContent = stars;

    // Progress bar at 100% on finish
    document.getElementById('progress-fill').style.width = '100%';
  }

  /* ---------- RESTART ---------- */
  function restartGame() {
    show('start-screen');
  }
</script>
</body>
</html>
